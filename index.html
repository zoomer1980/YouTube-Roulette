<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Roulette 🎰</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

#screen {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  grid-template-rows: repeat(12, 1fr);
  z-index: 1;
}

.pixel {
  border: 1px solid rgba(255,255,255,0.025);
}

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 5;
}

.panel {
  width: min(92%, 600px);
  padding: 35px 25px;
  text-align: center;
  background: rgba(5,5,5,0.94);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 25px;
  backdrop-filter: blur(15px);
}

.logo {
  font-size: 55px;
}

h1 {
  margin: 5px 0 15px;
  font-size: clamp(42px,10vw,75px);
  line-height: .9;
  letter-spacing: -4px;
}

.tagline {
  color: #aaa;
  line-height: 1.5;
  margin-bottom: 25px;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 25px;
}

.category {
  border: 1px solid #333;
  background: #111;
  color: #aaa;
  padding: 9px 13px;
  border-radius: 999px;
  font-size: 12px;
}

.category.active {
  background: white;
  color: black;
}

.spin {
  display: inline-block;
  width: 100%;
  max-width: 350px;
  padding: 18px;
  border-radius: 999px;
  background: white;
  color: black;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
}

.spin:active {
  transform: scale(.96);
}

.stats {
  margin-top: 20px;
  color: #777;
  font-size: 12px;
}

#hint {
  position: fixed;
  bottom: 15px;
  width: 100%;
  text-align: center;
  color: #444;
  font-size: 11px;
}

@media(max-width:600px) {

  #screen {
    grid-template-columns: repeat(12,1fr);
    grid-template-rows: repeat(20,1fr);
  }

}

</style>
</head>

<body>

<div id="screen">

<script>

for(let i = 0; i < 240; i++) {

  document.write(
    '<div class="pixel"></div>'
  );

}

</script>

</div>


<div id="overlay">

<div class="panel">

<div class="logo">
🎰
</div>

<h1>
YouTube<br>
Roulette
</h1>

<div class="tagline">
Click the button.<br>
Enter the rabbit hole.
</div>


<div class="categories">

<span class="category active">
🎰 Surprise Me
</span>

<span class="category">
🤯 Weird
</span>

<span class="category">
🔬 Science
</span>

<span class="category">
🌎 Places
</span>

<span class="category">
🕵️ Mystery
</span>

<span class="category">
🛠️ Machines
</span>

<span class="category">
📚 History
</span>

<span class="category">
🎵 Music
</span>

<span class="category">
😂 Funny
</span>

</div>


<a
class="spin"
href="https://www.youtube.com/"
>

🎰 SPIN THE ROULETTE

</a>


<div class="stats">

🕳️ Welcome to the rabbit hole

</div>

</div>

</div>


<div id="hint">

⚠️ You have been warned.

</div>

</body>
</html>
