<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Roulette 🎰</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

#screen{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(30,1fr);
  grid-template-rows:repeat(18,1fr);
  z-index:0
}

.pixel{
  border:1px solid rgba(255,255,255,.025);
  transition:.18s;
  cursor:pointer
}

.pixel:hover{
  background:rgba(255,255,255,.14);
  transform:scale(1.08)
}

#overlay{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}

.panel{
  width:min(94%,620px);
  padding:32px 24px;
  text-align:center;
  background:rgba(4,4,4,.91);
  border:1px solid rgba(255,255,255,.14);
  border-radius:28px;
  backdrop-filter:blur(18px);
  box-shadow:0 0 100px rgba(0,0,0,.95)
}

.logo{
  font-size:55px;
  margin-bottom:4px
}

h1{
  margin:0;
  font-size:clamp(42px,10vw,76px);
  line-height:.9;
  letter-spacing:-5px
}

.tagline{
  margin:18px 0 22px;
  color:#aaa;
  line-height:1.5
}

.categories{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-bottom:20px
}

.category{
  border:1px solid #333;
  background:#111;
  color:#bbb;
  padding:9px 13px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  transition:.15s
}

.category:hover,
.category.active{
  background:#fff;
  color:#000;
  border-color:#fff
}

#spin{
  width:100%;
  max-width:330px;
  border:0;
  border-radius:999px;
  padding:18px;
  background:#fff;
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.15s
}

#spin:hover{
  transform:scale(1.04);
  box-shadow:0 0 35px rgba(255,255,255,.25)
}

#spin:active{
  transform:scale(.97)
}

#status{
  min-height:20px;
  margin-top:17px;
  color:#aaa;
  font-size:13px
}

.stats{
  display:flex;
  justify-content:center;
  gap:25px;
  margin-top:18px;
  color:#777;
  font-size:12px
}

#share{
  margin-top:15px;
  background:transparent;
  color:#aaa;
  border:1px solid #333;
  border-radius:999px;
  padding:10px 17px;
  cursor:pointer
}

#hint{
  position:fixed;
  bottom:15px;
  left:0;
  width:100%;
  text-align:center;
  color:#444;
  font-size:11px;
  z-index:6
}

.spinning .pixel{
  animation:flash .18s infinite alternate
}

@keyframes flash{
  from{background:rgba(255,255,255,.02)}
  to{background:rgba(255,255,255,.22)}
}

@media(max-width:600px){
  #screen{
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(25,1fr)
  }

  .panel{
    padding:27px 18px
  }

  h1{
    letter-spacing:-3px
  }
}
</style>
</head>

<body>

<div id="screen"></div>

<div id="overlay">

<div class="panel">

<div class="logo">🎰</div>

<h1>YouTube<br>Roulette</h1>

<div class="tagline">
Click a pixel.<br>
Enter the rabbit hole.
</div>

<div class="categories">

<button class="category active" data-category="all">🎰 Surprise Me</button>
<button class="category" data-category="weird">🤯 Weird</button>
<button class="category" data-category="science">🔬 Science</button>
<button class="category" data-category="places">🌎 Places</button>
<button class="category" data-category="mystery">🕵️ Mystery</button>
<button class="category" data-category="machines">🛠️ Machines</button>
<button class="category" data-category="history">📚 History</button>
<button class="category" data-category="music">🎵 Music</button>
<button class="category" data-category="funny">😂 Funny</button>

</div>

<button id="spin">
🎰 SPIN THE ROULETTE
</button>

<div id="status"></div>

<div class="stats">
<span>🕳️ <b id="count">0</b> rabbit holes</span>
<span>🎬 <b id="watched">0</b> discoveries</span>
</div>

<button id="share">
📤 Share YouTube Roulette
</button>

</div>
</div>

<div id="hint">
⚠️ Warning: You may accidentally lose several hours.
</div>

<script>

/* ================================
   VIDEO DATABASE
   ================================ */

const videos = {

weird:[
"jNQXAC9IVRw",
"ScMzIvxBSi4"
],

science:[
"aqz-KE-bpKQ",
"ysz5S6PUM-U"
],

places:[
"Zi_XLOBDo_Y"
],

mystery:[
"3JZ_D3ELwOQ"
],

machines:[
"kJQP7kiw5Fk"
],

history:[
"fJ9rUzIMcZQ"
],

music:[
"9bZkp7q19f0",
"fJ9rUzIMcZQ"
],

funny:[
"dQw4w9WgXcQ"
]

};


/* ================================
   PIXELS
   ================================ */

const screen=document.getElementById("screen");

for(let i=0;i<540;i++){

  const pixel=document.createElement("div");

  pixel.className="pixel";

  pixel.onclick=spin;

  screen.appendChild(pixel);

}


/* ================================
   STATE
   ================================ */

let category="all";

let count=
Number(localStorage.getItem("rabbitHoles"))||0;

let watched=
Number(localStorage.getItem("discoveries"))||0;

let recent=
JSON.parse(
localStorage.getItem("recentVideos")||"[]"
);

updateStats();


/* ================================
   CATEGORY BUTTONS
   ================================ */

document.querySelectorAll(".category")
.forEach(button=>{

  button.onclick=()=>{

    document.querySelectorAll(".category")
    .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    category=button.dataset.category;

  };

});


/* ================================
   SPIN BUTTON
   ================================ */

document.getElementById("spin")
.onclick=spin;


/* ================================
   MAIN ROULETTE
   ================================ */

function spin(){

  const button=document.getElementById("spin");

  if(button.disabled)return;

  button.disabled=true;

  screen.classList.add("spinning");

  document.getElementById("status")
  .textContent="Searching the rabbit hole...";


  let pool=[];


  if(category==="all"){

    Object.values(videos)
    .forEach(list=>{
      pool.push(...list);
    });

  }else{

    pool=[...(videos[category]||[])];

  }


  /*
    Remove recently watched videos.
  */

  let available=
  pool.filter(id=>!recent.includes(id));


  /*
    If we've exhausted the pool,
    start recycling.
  */

  if(available.length===0){

    available=pool;

  }


  const video=
  available[
    Math.floor(
      Math.random()*available.length
    )
  ];


  /*
    Save recent videos.
  */

  recent.push(video);

  if(recent.length>8){

    recent.shift();

  }

  localStorage.setItem(
    "recentVideos",
    JSON.stringify(recent)
  );


  count++;

  watched++;


  localStorage.setItem(
    "rabbitHoles",
    count
  );

  localStorage.setItem(
    "discoveries",
    watched
  );

  updateStats();


  
}


/* ================================
   STATS
   ================================ */

function updateStats(){

  document.getElementById("count")
  .textContent=count;

  document.getElementById("watched")
  .textContent=watched;

}


/* ================================
   SHARE
   ================================ */

document.getElementById("share")
.onclick=async()=>{

  const text=
  "I found a YouTube rabbit hole 🎰🕳️";

  if(navigator.share){

    try{

      await navigator.share({

        title:"YouTube Roulette",

        text:text,

        url:window.location.href

      });const youtubeUrl =
  "https://www.youtube.com/watch?v=" + video;

window.location.href = youtubeUrl;

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(
        text+" "+window.location.href
      );

      document.getElementById("status")
      .textContent="Link copied!";

    }catch(e){}

  }

};

</script>

</body>
</html>
